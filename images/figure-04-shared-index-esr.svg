<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="300" fill="#F4F6F8" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#001E2B">IDX_SRCH_MAIN — Logical ESR Segments</text>

  <!-- Index bar -->
  <rect x="60" y="90" width="680" height="70" rx="8" fill="#001E2B"/>

  <!-- Equality segment -->
  <rect x="72"  y="102" width="290" height="46" rx="5" fill="#00ED64" opacity="0.85"/>
  <text x="217" y="122" text-anchor="middle" fill="#001E2B" font-weight="700" font-size="13">EQUALITY</text>
  <text x="217" y="140" text-anchor="middle" fill="#001E2B" font-size="11">SRCH.k · SRCH.v · JOIN_STATUS · ELIGIBILITY</text>

  <!-- Sort segment -->
  <rect x="368" y="102" width="250" height="46" rx="5" fill="#FFB81C" opacity="0.9"/>
  <text x="493" y="122" text-anchor="middle" fill="#001E2B" font-weight="700" font-size="13">SORT</text>
  <text x="493" y="140" text-anchor="middle" fill="#001E2B" font-size="11">OPEN_END_RANK · ENTR_RCGN_NO2 · SVC_CD · ENCN_ID</text>

  <!-- Residual -->
  <rect x="626" y="102" width="102" height="46" rx="5" fill="#CBD5E0"/>
  <text x="677" y="122" text-anchor="middle" fill="#001E2B" font-weight="700" font-size="12">RESIDUAL</text>
  <text x="677" y="140" text-anchor="middle" fill="#001E2B" font-size="10">ENCN_STUS_CD</text>

  <!-- Labels -->
  <text x="217" y="185" text-anchor="middle" font-size="11" fill="#00684A" font-weight="600">Prefix: narrows candidate set</text>
  <text x="493" y="185" text-anchor="middle" font-size="11" fill="#B07A00" font-weight="600">Provides index-ordered results</text>
  <text x="677" y="185" text-anchor="middle" font-size="11" fill="#525F6B">Post-fetch filter</text>

  <!-- ESR legend -->
  <text x="60"  y="220" font-size="12" fill="#001E2B" font-weight="600">ESR Rule:</text>
  <text x="160" y="220" font-size="12" fill="#001E2B">Equality → Sort → Range/Residual</text>
  <text x="60"  y="250" font-size="11" fill="#525F6B">Multikey index on SRCH[] array; $elemMatch fixes k &amp; v to the same array element.</text>
  <text x="60"  y="270" font-size="11" fill="#525F6B">Blocking SORT removal must be confirmed with explain("executionStats") on real data.</text>
</svg>
