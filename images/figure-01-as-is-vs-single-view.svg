<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="400" fill="#F4F6F8" rx="12"/>
  <text x="400" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#001E2B">AS-IS Multi-Step vs TO-BE Single View</text>

  <!-- AS-IS side -->
  <rect x="40" y="70" width="330" height="290" fill="#FFFFFF" rx="8" stroke="#CBD5E0" stroke-width="1"/>
  <text x="205" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#525F6B">AS-IS: Multi-Step Request</text>
  <g font-size="12" fill="#001E2B">
    <rect x="70" y="115" width="270" height="28" rx="4" fill="#E3FCF7" stroke="#00ED64" stroke-width="1.5"/>
    <text x="205" y="133" text-anchor="middle">API Request</text>
    <rect x="70" y="158" width="270" height="28" rx="4" fill="#FFF6E6" stroke="#FFB81C" stroke-width="1.5"/>
    <text x="205" y="176" text-anchor="middle">SQL 1 — encn list</text>
    <rect x="70" y="201" width="270" height="28" rx="4" fill="#FFF6E6" stroke="#FFB81C" stroke-width="1.5"/>
    <text x="205" y="219" text-anchor="middle">SQL 2–6 — cust, bill, svc, prod, addr</text>
    <rect x="70" y="244" width="270" height="28" rx="4" fill="#FFF6E6" stroke="#FFB81C" stroke-width="1.5"/>
    <text x="205" y="262" text-anchor="middle">Redis — ref data</text>
    <rect x="70" y="287" width="270" height="28" rx="4" fill="#FFF6E6" stroke="#FFB81C" stroke-width="1.5"/>
    <text x="205" y="305" text-anchor="middle">App composition &amp; sort</text>
    <rect x="70" y="330" width="270" height="24" rx="4" fill="#E3FCF7" stroke="#00ED64" stroke-width="1.5"/>
    <text x="205" y="346" text-anchor="middle" font-weight="600">Response</text>
  </g>

  <!-- TO-BE side -->
  <rect x="430" y="70" width="330" height="290" fill="#FFFFFF" rx="8" stroke="#00684A" stroke-width="1.5"/>
  <text x="595" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#00684A">TO-BE: Single View Request</text>
  <g font-size="12" fill="#001E2B">
    <rect x="460" y="115" width="270" height="28" rx="4" fill="#E3FCF7" stroke="#00ED64" stroke-width="1.5"/>
    <text x="595" y="133" text-anchor="middle">API Request</text>
    <rect x="460" y="170" width="270" height="50" rx="4" fill="#001E2B" stroke="#00ED64" stroke-width="2"/>
    <text x="595" y="192" text-anchor="middle" fill="#00ED64" font-weight="700">MongoDB Atlas</text>
    <text x="595" y="210" text-anchor="middle" fill="#FFFFFF">encn_single_view_v1</text>
    <text x="595" y="232" text-anchor="middle" font-size="11" fill="#525F6B">Single find() + sort + limit</text>
    <rect x="460" y="330" width="270" height="24" rx="4" fill="#E3FCF7" stroke="#00ED64" stroke-width="1.5"/>
    <text x="595" y="346" text-anchor="middle" font-weight="600">Response</text>
  </g>

  <!-- arrow -->
  <path d="M370 215 L 425 215" stroke="#00ED64" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00ED64"/>
    </marker>
  </defs>
</svg>
