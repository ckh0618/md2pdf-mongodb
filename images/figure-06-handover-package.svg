<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="800" height="320" fill="#F4F6F8" rx="12"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#001E2B">From Verified Analysis to Implementation Handover</text>

  <!-- Inputs -->
  <g font-size="12" fill="#001E2B">
    <rect x="30"  y="80"  width="160" height="40" rx="6" fill="#FFF6E6" stroke="#FFB81C"/>
    <text x="110" y="105" text-anchor="middle">Business requirements</text>
    <rect x="30"  y="135" width="160" height="40" rx="6" fill="#FFF6E6" stroke="#FFB81C"/>
    <text x="110" y="160" text-anchor="middle">AS-IS source model</text>
    <rect x="30"  y="190" width="160" height="40" rx="6" fill="#FFF6E6" stroke="#FFB81C"/>
    <text x="110" y="215" text-anchor="middle">Application queries</text>
  </g>

  <!-- Verification -->
  <rect x="250" y="120" width="160" height="70" rx="10" fill="#00684A"/>
  <text x="330" y="148" text-anchor="middle" fill="#FFFFFF" font-weight="700" font-size="13">Verification</text>
  <text x="330" y="168" text-anchor="middle" fill="#E3FCF7" font-size="11">ESR · explain</text>
  <text x="330" y="184" text-anchor="middle" fill="#E3FCF7" font-size="11">result compatibility</text>

  <!-- Handover package -->
  <rect x="470" y="70" width="290" height="210" rx="12" fill="#001E2B" stroke="#00ED64" stroke-width="2"/>
  <text x="615" y="98" text-anchor="middle" fill="#00ED64" font-weight="700" font-size="14">Handover Package</text>
  <line x1="490" y1="108" x2="740" y2="108" stroke="#00ED64" opacity="0.4"/>
  <g font-size="11" fill="#FFFFFF">
    <text x="500" y="130">• Final Schema</text>
    <text x="500" y="152">• Source Mapping</text>
    <text x="500" y="174">• Search Mapping</text>
    <text x="500" y="196">• Canonical Query</text>
    <text x="500" y="218">• Index Definition</text>
    <text x="500" y="240">• Validation Matrix</text>
    <text x="500" y="262">• Decision Log</text>
  </g>

  <!-- arrows -->
  <path d="M190 100 L245 140" stroke="#FFB81C" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M190 155 L245 155" stroke="#FFB81C" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M190 210 L245 170" stroke="#FFB81C" stroke-width="2" marker-end="url(#a6)"/>
  <path d="M410 155 L465 155" stroke="#00ED64" stroke-width="3" marker-end="url(#a6)"/>

  <defs>
    <marker id="a6" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00ED64"/>
    </marker>
  </defs>
</svg>
